name: T210 compact overlay selection

on:
  push:
    branches: [yang/t210-overlay-selection-20261116]

permissions:
  contents: read

jobs:
  overlay-selection:
    runs-on: ubuntu-24.04-8x
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Install protoc for Lance all-features lint
        uses: taiki-e/install-action@66068bfca13dcb2ea07c3f613ca2836a37c755d5 # protoc
        with:
          tool: protoc
      - name: Verify exact source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Reuse exact unchanged implementation coverage
        run: |
          # CI 43771362578 passed 79 overlay and 60 integration cases.
          # CI 43775040662 verified their source was unchanged at b77e736b8.
          # This follow-up changes only the diagnostic example and this workflow.
          git diff --exit-code b77e736b8a7d4a0fd87c169dadc14add078f45ae HEAD -- \
            Cargo.toml Cargo.lock rust-toolchain.toml rust/lance/src \
            rust/lance/Cargo.toml
      - name: Verify overlay diagnostic fixtures and complete results
        env:
          LANCE_CPU_THREADS: 1
          LANCE_ENABLE_UNSTABLE_DATA_OVERLAY_FILES: "1"
        run: |
          cargo build --profile ci --locked -p lance --example overlay_selection
          for version in 2.2 2.3; do
            fixture="$RUNNER_TEMP/t210-overlay-$version"
            target/ci/examples/overlay_selection prepare "$fixture" 8193 4 "$version"
            target/ci/examples/overlay_selection verify "$fixture" full 256 2
            target/ci/examples/overlay_selection verify "$fixture" ranges 17 2
            target/ci/examples/overlay_selection verify "$fixture" pruned 17 2
            if target/ci/examples/overlay_selection verify "$fixture" full 256 0; then
              echo "zero repetitions must fail"
              exit 1
            fi
          done
      - name: Lint touched paths
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --profile ci --locked -p lance --all-features --all-targets --no-deps -- -D warnings
